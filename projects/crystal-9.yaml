description: >-
  Redesigned a sparse MoE tic-tac-toe policy for a 13-token vocabulary and tight
  memory budgets. Released a 46,299-byte packed INT4 artifact for a custom local
  runtime, with zero policy misses across 294,778 legal histories. A compact
  adaptation powers Crystal Palace 9 on the C64.
