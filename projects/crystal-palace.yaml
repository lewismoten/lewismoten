name: Crystal Palace 9
title: Crystal Palace 9 | AI on 8-bit hardware
image: crystal-palace.jpg
description: >-
  Built a Commodore 64 tic-tac-toe game whose AI moves come from a real neural
  network running in 6502 assembly, with a command-room interface in 8 x 8
  multicolor graphics. Now powered by Falken-9, a complete AI-vs-AI game takes
  just over a minute, down from about 20 with the original Crystal-9 weights.
