# Project card used by the profile README and selected-projects PDF.
name: Falken-9
title: Falken-9 | A neural network designed for the C64
image: falken-9.jpg
description: >-
  Trained a mixture-of-experts tic-tac-toe model for the Commodore 64 from the
  start: width 8, four experts with top-2 routing and exact integer 6502
  inference in a 5,195-byte model that stays in RAM. Crystal Palace 9 now plays
  a complete AI-vs-AI game in just over a minute, with a research report that
  probes the network.
