# Project card used by the profile README and selected-projects PDF.
name: "Game-Maker: Sandbox Edition"
title: "Game-Maker: Sandbox Edition | DOS engine port and visual editors"
image: gamemaker-sandbox.png
description: >-
  Reimplemented and extended RSD Game-Maker 3.0 in TypeScript, preserving original
  DOS file formats while adding browser-based visual editors, OPL2 audio, offline
  play, and desktop exports. Built automated level checks and replayable
  walkthroughs, reusable engine and tooling packages, and original games within
  an interactive 1994 desktop.
