title: Selected Projects | Front-End Engineering, Applied AI & Creative Tools
intro: Public work and live demos with source links where available.

# Image paths are relative to this YAML file in resume/builder.
# These names point directly to the existing projects/ directory in the repo.
pages:
  - kicker: Project index / 01
    heading: Applied AI and visualization
    projects:
      - title: Zogograph Client | AI-assisted server monitoring
        image: ../../projects/zogograph-client.jpg
        description: >-
          PHP/SQLite collectors and a JavaScript dashboard make server
          telemetry, alerts, and diagnostics readable. An AI assistant calls
          diagnostic tools and tracks the cost of an investigation.
        links:
          - {label: Source, url: 'https://github.com/lewismoten/zogograph-client'}
          - {label: Videos, url: 'https://www.youtube.com/watch?v=OKndBMPknmQ&list=PLaLeerEZeFMs'}
      - title: Palace-9 | Local model inspection
        image: ../../projects/palace-9.jpg
        description: >-
          A playable tic-tac-toe lab pairs a deterministic controller with a
          compact MoE model trained from scratch. It uses the Qwen2-MoE
          architecture for Ollama and llama.cpp compatibility without a custom
          fork; the browser inspects checkpoints locally.
        links:
          - {label: Live demo, url: 'https://lewismoten.github.io/palace-9/'}
          - {label: Source, url: 'https://github.com/lewismoten/palace-9'}
          - {label: Ollama, url: 'https://ollama.com/lewismoten/palace-9'}
          - {label: Hugging Face, url: 'https://huggingface.co/lewismoten/palace-9'}
          - {label: Video, url: 'https://www.youtube.com/watch?v=J7bgpmks_KM'}
      - title: D64 Storage Lab | Repair and optimization
        image: ../../projects/storage-d64.jpg
        description: >-
          A JavaScript workbench maps Commodore 64 disk sectors and file
          chains, estimates read efficiency, repairs corruption, restores
          deleted files, and compares optimized and fragmented layouts.
        links:
          - {label: Live demo, url: 'https://lewismoten.github.io/storage-d64/'}
          - {label: Source, url: 'https://github.com/lewismoten/storage-d64'}
          - {label: Video, url: 'https://www.youtube.com/watch?v=cXeIy4AZewY'}
      - title: Sculpted Prim Toolkit | Three.js editor
        image: ../../projects/sculpted-prim-toolkit.jpg
        description: >-
          Decodes Second Life-style RGB sculpt maps into editable 3D geometry.
          Camera views, mesh overlays, textures, and vertex tools support PNG,
          glTF/GLB, OBJ, and STL exports.
        links:
          - {label: Live demo, url: 'https://lewismoten.github.io/sculpted-prim-toolkit/'}
          - {label: Source, url: 'https://github.com/lewismoten/sculpted-prim-toolkit'}
          - {label: Videos, url: 'https://www.youtube.com/watch?v=egAIXJwAAHw&list=PLIyz44ZkJ3sk'}

  - kicker: Project index / 02
    heading: Audio, Unicode, and public tools
    projects:
      - title: Data Over Audio | Web Audio API
        image: ../../projects/data-over-audio.jpg
        description: >-
          Transfers text and binary data through sound using MFSK modulation,
          packetization, CRC checks, Hamming error correction, interleaving,
          and repeat requests.
        links:
          - {label: Live demo, url: 'https://lewismoten.github.io/data-over-audio/'}
          - {label: Source, url: 'https://github.com/lewismoten/data-over-audio'}
          - {label: Videos, url: 'https://www.youtube.com/watch?v=_6qxB3gKN_E&list=PLEyaach61fdU-OPcb5Aqgah2l6TTsaLia'}
      - title: Emoji Explorer | Unicode and pixel font
        image: ../../projects/emoji.jpg
        description: >-
          A localized Unicode explorer with version and sequence filters,
          favorites, keyboard navigation, and offline PWA support. Includes
          a custom 12 x 12 Pixel Emoji font and pixel editor.
        links:
          - {label: Live demo, url: 'https://lewismoten.github.io/emoji/'}
          - {label: Source, url: 'https://github.com/lewismoten/emoji'}
          - {label: npm, url: 'https://www.npmjs.com/package/@lewismoten/emoji'}
      - title: Dreamy Tags | WordPress plugin
        image: ../../projects/dreamy-tags.jpg
        description: >-
          An open-source PHP/Gutenberg plugin for category- and tag-filtered
          clouds, with exclusion rules and minimum-use thresholds. Published
          as a block, widget, and shortcode.
        links:
          - {label: Plugin directory, url: 'https://wordpress.org/plugins/dreamy-tags/'}
          - {label: Source, url: 'https://github.com/lewismoten/dreamy-tags'}
      - title: Restoring the Signal | Dialable exhibit
        image: ../../projects/phone-exhibit.jpg
        description: >-
          A live installation at Stone Branch Center for the Arts joins
          Raspberry Pi, Asterisk, and a PHP contribution site. It handles
          telephone audio, dialplans, transcription, and TTY support.
        links:
          - {label: Live demo, url: 'https://phone.lewismoten.com/'}
          - {label: Source, url: 'https://github.com/lewismoten/Phone-Exhibit'}
          - {label: Videos, url: 'https://www.youtube.com/watch?v=kmOV7_2MKPg&list=PLHG0YVBnnA7k'}
          - {label: Press and photos, url: 'https://www.nvdaily.com/nvdaily/dial-i-for-interactive-new-exhibit-celebrates-150-years-of-communication/article_06d37f43-5f2d-5ee3-9621-2dc1853ef4c2.html'}

  - kicker: Project index / 03
    heading: Browser tools and creative projects
    projects:
      - title: QR Code Generator | Creator and inspector
        image: ../../projects/qr.jpg
        description: >-
          A browser tool backed by a first-party ES module for mixed
          segmentation, versions 1-40, Reed-Solomon correction, mask
          selection, and structural inspection.
        links:
          - {label: Live demo, url: 'https://qr.lewismoten.com/'}
          - {label: Source, url: 'https://github.com/lewismoten/qr'}
      - title: Tiny Pockets Press | Miniature publishing
        image: ../../projects/tiny-pockets-press.jpg
        description: >-
          A modular JavaScript editor for miniature books, with layout and
          imposition logic and separate interior and cover print/PDF views.
        links:
          - {label: Live demo, url: 'https://lewismoten.github.io/Tiny-Pockets-Press/#editor'}
          - {label: Source, url: 'https://github.com/lewismoten/Tiny-Pockets-Press'}
          - {label: Videos, url: 'https://www.youtube.com/watch?v=w9IwuwX7BkE&list=PLAgk77H8yVCA'}
      - title: Shoomi's HomePage | GeoCities restoration
        image: ../../projects/athens-acropolis-4507.jpg
        description: >-
          A 1990s web restoration with a Canvas recreation of its Java
          applet marquee, Web Audio MIDI playback, and a browser version
          of a Visual Basic color editor.
        links:
          - {label: Live demo, url: 'https://lewismoten.github.io/Athens-Acropolis-4507/'}
          - {label: Source, url: 'https://github.com/lewismoten/Athens-Acropolis-4507'}
          - {label: Videos, url: 'https://www.youtube.com/watch?v=UgJgb0VUaHw&list=PLI4A73VhrZT4'}
      - title: Crystal Palace 9 | AI on 8-bit hardware
        image: ../../projects/crystal-palace.jpg
        description: >-
          Built a Commodore 64 tic-tac-toe game around Crystal-9, a compact
          mixture-of-experts model trained to choose moves. Adapted inference
          and a command-room interface to the machine's tight memory and
          8 x 8 multicolor graphics constraints.
        links:
          - {label: Source, url: 'https://github.com/lewismoten/crystal-palace'}
          - {label: Videos, url: 'https://www.youtube.com/watch?v=UJME73NxyfA'}
